<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL QUIZ</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Tahoma,sans-serif; }
body { background:#000; color:#fff; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
.box { width:100%; max-width:500px; background:#0a0a0a; border:1px solid #222; padding:30px; }
h1 { font-size:32px; text-align:center; letter-spacing:4px; margin-bottom:10px; }
h1 span { color:#0f0; }
.sub { text-align:center; color:#666; font-size:12px; margin-bottom:30px; letter-spacing:2px; }
input { width:100%; padding:15px; background:#111; border:1px solid #333; color:#fff; font-size:16px; margin-bottom:15px; text-align:center; }
input:focus { outline:none; border-color:#0f0; }
button { width:100%; padding:15px; background:#fff; color:#000; border:none; font-size:16px; font-weight:bold; cursor:pointer; letter-spacing:2px; }
button:hover { background:#0f0; }
.msg { text-align:center; margin-top:15px; font-size:13px; min-height:20px; }
.err { color:#f00; }
.ok { color:#0f0; }
.notice { background:#111; border-right:3px solid #0f0; padding:15px; margin-bottom:20px; font-size:13px; line-height:1.8; }
.notice b { color:#0f0; display:block; margin-bottom:5px; }
.prize { text-align:center; background:#111; border:1px solid #333; padding:20px; margin-bottom:20px; }
.prize b { color:#0f0; font-size:14px; letter-spacing:2px; }
.prize p { margin-top:10px; font-size:18px; }
#quizScreen, #resultScreen { display:none; }
.q-num { color:#666; font-size:12px; margin-bottom:10px; letter-spacing:2px; }
.q-text { font-size:18px; margin-bottom:20px; line-height:1.8; min-height:60px; }
.timer { text-align:center; font-size:24px; color:#0f0; margin-bottom:20px; font-weight:bold; }
.timer.warn { color:#f00; }
.opt { width:100%; padding:15px; background:#111; border:1px solid #333; color:#fff; text-align:right; font-size:15px; margin-bottom:10px; cursor:pointer; transition:0.3s; }
.opt:hover:not(.disabled) { border-color:#0f0; }
.opt.correct { background:#0f0; color:#000; border-color:#0f0; animation:pulse 0.5s; }
.opt.wrong { background:#f00; color:#fff; border-color:#f00; animation:shake 0.5s; }
.opt.disabled { cursor:not-allowed; opacity:0.6; }
@keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.score { text-align:center; font-size:64px; color:#0f0; font-weight:bold; margin:20px 0; }
.rank { text-align:center; font-size:20px; margin-bottom:20px; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th, td { padding:10px; border-bottom:1px solid #222; text-align:center; font-size:13px; }
th { color:#0f0; font-size:11px; letter-spacing:1px; }
.me { background:#111; color:#0f0; }
</style>
</head>
<body>

<!-- صفحه ورود -->
<div class="box" id="loginScreen">
  <h1>FOOTBALL<span>.</span>QUIZ</h1>
  <div class="sub">TEST YOUR KNOWLEDGE</div>
  
  <div class="prize">
    <b>🏆 جایزه نفر اول</b>
    <p id="prizeText">جایزه ویژه برای رتبه یک</p>
  </div>
  
  <div class="notice" id="noticeBox">
    <b>📢 اطلاعیه</b>
    <span id="noticeText">خوش آمدید</span>
  </div>
  
  <input type="text" id="nameInput" placeholder="نام خود را وارد کنید" maxlength="20">
  <button onclick="startQuiz()">شروع آزمون</button>
  <div class="msg" id="loginMsg"></div>
</div>

<!-- صفحه آزمون -->
<div class="box" id="quizScreen">
  <div class="q-num" id="qNum">QUESTION 1 / 50</div>
  <div class="timer" id="timer">12</div>
  <div class="q-text" id="qText"></div>
  <div id="options"></div>
</div>

<!-- صفحه نتیجه -->
<div class="box" id="resultScreen">
  <h1>RESULT<span>.</span></h1>
  <div class="score" id="finalScore">0</div>
  <div class="rank" id="rankText"></div>
  <table>
    <thead><tr><th>رتبه</th><th>نام</th><th>نمره</th></tr></thead>
    <tbody id="leaderboard"></tbody>
  </table>
</div>

<script>
// ==================== تنظیمات ====================
const TIMER_SECONDS = 12;
const TOTAL_QUESTIONS = 50;
const MAX_SCORE = 100;

// ==================== سوالات پیش‌فرض (اینجا سوالاتت رو وارد کن) ====================
const DEFAULT_QUESTIONS = [
  // نمونه - اینا رو حذف کن و سوالات خودت رو بذار
  { q: "تیم ملی فوتبال ایران در جام جهانی ۲۰۲۲ در کدام گروه بود؟", a: "گروه A", b: "گروه B", c: "گروه C", d: "گروه D", correct: "b" },
  { q: "لیونل مسی در سال ۲۰۲۲ توپ طلا را برد؟", a: "بله", b: "خیر", c: "نامعلوم", d: "مشترک", correct: "a" }
];

// ==================== متغیرها ====================
let questions = [];
let currentQ = 0;
let correctCount = 0;
let timeLeft = TIMER_SECONDS;
let timerInterval = null;
let playerName = "";
let answered = false;
let quizActive = false;

// ==================== شروع آزمون ====================
function startQuiz() {
  playerName = document.getElementById('nameInput').value.trim();
  const msg = document.getElementById('loginMsg');
  
  if (playerName.length < 2) {
    msg.className = 'msg err';
    msg.textContent = 'نام باید حداقل ۲ حرف باشد';
    return;
  }
  
  // چک تکراری بودن نام
  let players = JSON.parse(localStorage.getItem('players') || '[]');
  if (players.find(p => p.name === playerName)) {
    msg.className = 'msg err';
    msg.textContent = 'این نام قبلاً استفاده شده';
    return;
  }
  
  // چک اگه قبلاً خارج شده
  if (localStorage.getItem('exited_' + playerName)) {
    msg.className = 'msg err';
    msg.textContent = 'شما قبلاً از آزمون خارج شده‌اید';
    return;
  }
  
  // بارگذاری سوالات
  let stored = JSON.parse(localStorage.getItem('questions') || '[]');
  questions = stored.length > 0 ? stored : DEFAULT_QUESTIONS;
  
  if (questions.length === 0) {
    msg.className = 'msg err';
    msg.textContent = 'هنوز سوالی ثبت نشده';
    return;
  }
  
  // شافل و انتخاب ۵۰ سوال
  questions = [...questions].sort(() => Math.random() - 0.5).slice(0, TOTAL_QUESTIONS);
  
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  quizActive = true;
  
  window.addEventListener('beforeunload', preventExit);
  document.addEventListener('visibilitychange', handleVisibility);
  
  showQuestion();
}

// ==================== جلوگیری از خروج ====================
function preventExit(e) {
  if (quizActive) {
    e.preventDefault();
    e.returnValue = '';
  }
}

function handleVisibility() {
  if (document.hidden && quizActive) {
    endQuiz(true);
  }
}

// ==================== نمایش سوال ====================
function showQuestion() {
  if (currentQ >= questions.length) {
    endQuiz(false);
    return;
  }
  
  answered = false;
  const q = questions[currentQ];
  
  document.getElementById('qNum').textContent = `QUESTION ${currentQ + 1} / ${questions.length}`;
  document.getElementById('qText').textContent = q.q;
  
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  
  ['a', 'b', 'c', 'd'].forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = q[key];
    btn.onclick = () => answer(key, btn);
    opts.appendChild(btn);
  });
  
  timeLeft = TIMER_SECONDS;
  updateTimer();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) answer(null, null);
    }
  }, 1000);
}

function updateTimer() {
  const t = document.getElementById('timer');
  t.textContent = timeLeft;
  t.className = timeLeft <= 4 ? 'timer warn' : 'timer';
}

// ==================== پاسخ ====================
function answer(choice, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  
  const q = questions[currentQ];
  const allBtns = document.querySelectorAll('.opt');
  
  allBtns.forEach(b => {
    b.classList.add('disabled');
    b.onclick = null;
  });
  
  const correctIndex = ['a', 'b', 'c', 'd'].indexOf(q.correct);
  allBtns[correctIndex].classList.add('correct');
  
  if (choice === q.correct) {
    correctCount++;
  } else if (choice && btn) {
    btn.classList.add('wrong');
  }
  
  setTimeout(() => {
    currentQ++;
    showQuestion();
  }, 1500);
}

// ==================== پایان آزمون ====================
function endQuiz(forceExit) {
  quizActive = false;
  clearInterval(timerInterval);
  window.removeEventListener('beforeunload', preventExit);
  document.removeEventListener('visibilitychange', handleVisibility);
  
  if (forceExit) {
    localStorage.setItem('exited_' + playerName, '1');
  }
  
  const finalScore = Math.round((correctCount / questions.length) * MAX_SCORE);
  
  let players = JSON.parse(localStorage.getItem('players') || '[]');
  players.push({ name: playerName, score: finalScore });
  localStorage.setItem('players', JSON.stringify(players));
  
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  document.getElementById('finalScore').textContent = finalScore;
  
  showLeaderboard(players, finalScore);
}

// ==================== رتبه‌بندی ====================
function showLeaderboard(players, myScore) {
  const sorted = [...players].sort((a, b) => b.score - a.score);
  
  let rank = 1;
  let prevScore = null;
  const ranked = [];
  
  sorted.forEach((p, i) => {
    if (p.score !== prevScore) {
      rank = i + 1;
      prevScore = p.score;
    }
    ranked.push({ ...p, rank });
  });
  
  const myEntry = ranked.find(p => p.name === playerName);
  document.getElementById('rankText').innerHTML = 
    `رتبه شما: <b style="color:#0f0">${myEntry.rank}</b> از ${ranked.length}`;
  
  const tbody = document.getElementById('leaderboard');
  tbody.innerHTML = '';
  ranked.forEach(p => {
    const tr = document.createElement('tr');
    if (p.name === playerName) tr.className = 'me';
    tr.innerHTML = `<td>${p.rank}</td><td>${p.name}</td><td>${p.score}</td>`;
    tbody.appendChild(tr);
  });
}

// ==================== بارگذاری تنظیمات ====================
(function loadSettings() {
  const n = localStorage.getItem('notice');
  if (n) document.getElementById('noticeText').textContent = n;
  const p = localStorage.getItem('prize');
  if (p) document.getElementById('prizeText').textContent = p;
})();
</script>
</body>
  </html>
